# MariaDB, rAthena's login, char, map and web servers, and the account portal.
# Settings come from .env (copy .env.example to start).

# Every rAthena service runs the same image. Only db-init has `build:`,
# so the image is built once (when missing, or with --build); the others
# use it and never try to pull it from a registry.
x-rathena: &rathena
  image: rag-wrapper/rathena:${PACKETVER:-20250716}
  pull_policy: never
  restart: on-failure
  # Config overrides from the desktop app's Settings screen or written by
  # hand; entrypoint.sh imports them after rAthena's stock configs.
  volumes:
    - ./overrides:/rathena/conf/user:ro
  environment:
    DB_HOST: db
    DB_NAME: ragnarok
    DB_USER: ragnarok
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    INTER_USER: ${INTER_USER:?set INTER_USER in .env}
    INTER_PASSWORD: ${INTER_PASSWORD:?set INTER_PASSWORD in .env}
    PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    ADMIN_USER: ${ADMIN_USER:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  db:
    image: mariadb:11.4
    restart: on-failure
    environment:
      MARIADB_DATABASE: ragnarok
      MARIADB_USER: ragnarok
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  db-init:
    <<: *rathena
    build:
      context: docker/rathena
      args:
        RATHENA_REPO: ${RATHENA_REPO:-https://github.com/akreao/rathena.git}
        RATHENA_COMMIT: ${RATHENA_COMMIT:-b6f89abe300d821412380a2004385532d0d4d9b6}
        PACKETVER: ${PACKETVER:-20250716}
        PRERE: ${PRERE:-yes}
    pull_policy: !reset null
    command: init
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  login:
    <<: *rathena
    command: login
    ports:
      - "6900:6900"
    depends_on:
      db-init:
        condition: service_completed_successfully

  char:
    <<: *rathena
    command: char
    ports:
      - "6121:6121"
    depends_on:
      - login

  map:
    <<: *rathena
    command: map
    ports:
      - "5121:5121"
    depends_on:
      - char

  web:
    <<: *rathena
    command: web
    ports:
      - "8888:8888"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Account registration and management for players and admins.
  portal:
    build: portal
    image: rag-wrapper/portal
    restart: on-failure
    environment:
      DB_HOST: db
      DB_NAME: ragnarok
      DB_USER: ragnarok
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Shown on the "How to connect" page and written into clientinfo.xml.
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      PACKETVER: ${PACKETVER:-20250716}
    # The server name comes from the Settings screen's char_conf.txt.
    volumes:
      - ./overrides:/overrides:ro
    ports:
      - "${PORTAL_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  db-data:
