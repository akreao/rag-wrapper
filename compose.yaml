# MariaDB, rAthena's login, char, map and web servers, and the account portal.
# Settings come from .env (copy .env.example to start).

# Docker keeps each container's output for as long as the container
# exists; this caps it at 30 MB per service.
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

# Ports are published on every address of this computer unless BIND_IP
# names one (an IPv4 address of this computer, such as its LAN or VPN
# address), which keeps them off other networks the computer is on.
# Docker's port rules go around ufw and firewalld, so a host firewall
# doesn't do that on its own.

# Every rAthena service runs the same image. Only db-init has `build:`,
# so the image is built once (when missing, or with --build); the others
# use it and never try to pull it from a registry.
# RATHENA_IMAGE and PORTAL_IMAGE are for the desktop app: it builds a new
# image under another name and renames it only once every image is ready.
x-rathena: &rathena
  image: ${RATHENA_IMAGE:-rag-wrapper/rathena:${PACKETVER:-20250716}}
  pull_policy: never
  restart: on-failure
  logging: *logging
  # Config overrides from the desktop app's Settings screen or written by
  # hand; entrypoint.sh imports them after rAthena's stock configs. It
  # also loads the mods switched on in mods/enabled.txt.
  volumes:
    - ./overrides:/rathena/conf/user:ro
    - ./mods:/rathena/mods:ro
  environment: &rathena-env
    DB_HOST: db
    DB_NAME: ragnarok
    DB_USER: ragnarok
    DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
    INTER_USER: ${INTER_USER:?set INTER_USER in .env}
    INTER_PASSWORD: ${INTER_PASSWORD:?set INTER_PASSWORD in .env}
    PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
    # Matches the build; picks the item database for the portal's item names.
    PRERE: ${PRERE:-yes}
    ADMIN_USER: ${ADMIN_USER:-}
    ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}

services:
  db:
    image: mariadb:11.4
    restart: on-failure
    logging: *logging
    environment:
      MARIADB_DATABASE: ragnarok
      MARIADB_USER: ragnarok
      MARIADB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      MARIADB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    volumes:
      - db-data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 5s
      timeout: 5s
      retries: 30

  db-init:
    <<: *rathena
    build:
      context: docker/rathena
      args:
        RATHENA_REPO: ${RATHENA_REPO:-https://github.com/akreao/rathena.git}
        RATHENA_COMMIT: ${RATHENA_COMMIT:-266a587f6a0901bbd9d6935f359c7ff0bf65b9aa}
        PACKETVER: ${PACKETVER:-20250716}
        PRERE: ${PRERE:-yes}
    pull_policy: !reset null
    command: init
    # Only db-init gets root: it makes each game mode's characters database.
    environment:
      <<: *rathena-env
      DB_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:?set DB_ROOT_PASSWORD in .env}
    restart: "no"
    depends_on:
      db:
        condition: service_healthy

  login:
    <<: *rathena
    command: login
    ports:
      - "${BIND_IP:+${BIND_IP}:}6900:6900"
    depends_on:
      db-init:
        condition: service_completed_successfully

  char:
    <<: *rathena
    command: char
    ports:
      - "${BIND_IP:+${BIND_IP}:}6121:6121"
    depends_on:
      - login

  map:
    <<: *rathena
    command: map
    ports:
      - "${BIND_IP:+${BIND_IP}:}5121:5121"
    depends_on:
      - char

  web:
    <<: *rathena
    command: web
    ports:
      - "${BIND_IP:+${BIND_IP}:}8888:8888"
    depends_on:
      db-init:
        condition: service_completed_successfully

  # Account registration and management for players and admins.
  portal:
    build: portal
    image: ${PORTAL_IMAGE:-rag-wrapper/portal}
    restart: on-failure
    logging: *logging
    environment:
      DB_HOST: db
      DB_NAME: ragnarok
      DB_USER: ragnarok
      DB_PASSWORD: ${DB_PASSWORD:?set DB_PASSWORD in .env}
      # Shown on the "How to connect" page and written into clientinfo.xml.
      PUBLIC_IP: ${PUBLIC_IP:-127.0.0.1}
      PACKETVER: ${PACKETVER:-20250716}
      PRERE: ${PRERE:-yes}
      # Signs what the players' patcher downloads (portal/signing.go).
      PATCH_SIGNING_KEY: ${PATCH_SIGNING_KEY:-}
    # The server name comes from the Settings screen's char_conf.txt.
    # patches/ holds the client patches the patcher downloads.
    volumes:
      - ./overrides:/overrides:ro
      - ./patches:/patches:ro
    ports:
      - "${BIND_IP:+${BIND_IP}:}${PORTAL_PORT:-8080}:8080"
    depends_on:
      db-init:
        condition: service_completed_successfully

volumes:
  db-data:
