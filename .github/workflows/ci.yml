# Checks every pull request and every push to main.
name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  portal:
    name: Portal (Go)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: portal
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: portal/go.mod
          cache-dependency-path: portal/go.sum
      - name: gofmt
        run: test -z "$(gofmt -l . | tee /dev/stderr)"
      - run: go vet ./...
      - name: go vet (Windows patcher)
        run: GOOS=windows go vet ./cmd/patcher
      - run: go test ./...

  stack:
    name: Compose stack
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: compose.yaml and .env.example
        run: |
          cp .env.example .env
          docker compose config --quiet
      - name: shellcheck
        run: shellcheck --severity=warning docker/rathena/entrypoint.sh .github/smoke/*.sh portal/clientfiles/play-on-linux.sh
      - name: merge_mods.py tests
        run: |
          python3 -c 'import yaml' 2>/dev/null || { sudo apt-get update && sudo apt-get install -y python3-yaml; }
          python3 -m unittest docker/rathena/test_merge_mods.py
      - name: entrypoint.sh tests
        run: python3 -m unittest docker/rathena/test_entrypoint.py

  # Starts the whole stack with a sample mod (.github/smoke/) and plays it
  # the way a player does: registers on the portal, logs in to the login
  # server and enters the char server, and checks the map server loaded
  # the mod. Uses the published images when this PR doesn't change what
  # they're built from.
  smoke:
    name: Stack smoke test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Images
        run: .github/smoke/images.sh
      - name: Start the stack and log in
        run: .github/smoke/run.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --timestamps

  # The same in Renewal, which has its own image and characters database.
  smoke-renewal:
    name: Stack smoke test (Renewal)
    runs-on: ubuntu-24.04
    env:
      PRERE: 'no'
    steps:
      - uses: actions/checkout@v4
      - name: Images
        run: .github/smoke/images.sh
      - name: Start the stack and log in
        run: .github/smoke/run.sh
      - name: Logs
        if: failure()
        run: docker compose logs --no-color --timestamps

  # Compiling rAthena (and the portal's Windows patcher) is slow, so these
  # only build when the image or what it builds changes. The job keeps its
  # old name, which main's branch settings require.
  rathena-changes:
    name: Detect rAthena image changes
    runs-on: ubuntu-24.04
    outputs:
      rathena: ${{ steps.filter.outputs.rathena }}
      portal: ${{ steps.filter.outputs.portal }}
    steps:
      - uses: actions/checkout@v4
      - uses: dorny/paths-filter@v3
        id: filter
        with:
          filters: |
            rathena:
              - 'docker/rathena/**'
              - '.env.example'
              - 'compose.yaml'
              - '.github/workflows/ci.yml'
            portal:
              - 'portal/Dockerfile'
              - 'portal/cmd/**'
              - 'portal/go.mod'
              - '.github/workflows/ci.yml'

  rathena:
    name: rAthena image
    needs: rathena-changes
    if: needs.rathena-changes.outputs.rathena == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the image at the version in .env.example
        run: |
          cp .env.example .env
          docker compose build db-init

  # Builds the portal image, which cross-compiles both Windows patchers
  # (ours from portal/cmd/patcher, and rpatchur).
  portal-image:
    name: Portal image
    needs: rathena-changes
    if: needs.rathena-changes.outputs.portal == 'true'
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Build the portal image
        run: docker build -t rag-wrapper/portal portal
      - name: The image holds the Windows patcher
        run: |
          docker create --name portal rag-wrapper/portal
          docker cp portal:/patcher ./patcher
          ls -l patcher
          file patcher/rpatchur.exe | tee /dev/stderr | grep -q 'PE32+ executable (GUI) x86-64'
          file patcher/rag-wrapper-patcher.exe | tee /dev/stderr | grep -q 'PE32+ executable (GUI) x86-64'
          test -s patcher/LICENSE-Go

  # Compile checks only; packaged builds come with tagged releases.
  desktop:
    name: Desktop app (Rust)
    runs-on: ubuntu-24.04
    defaults:
      run:
        working-directory: desktop/src-tauri
    steps:
      - uses: actions/checkout@v4
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: clippy
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri
      - run: cargo clippy --all-targets --locked -- -D warnings
      - run: cargo test --locked
