# Builds the desktop app as an AppImage.
#
# A push to main whose app version (desktop/src-tauri/tauri.conf.json) has no
# GitHub release yet publishes one, tagged v<version>, so merging a version
# bump is the release. Notes in docs/releases/<version>.md lead the release.
# Pull requests that touch the packaging, and a manual run, build it and keep
# it as a workflow artifact.
name: Release

on:
  push:
    branches: [main]
  pull_request:
    paths:
      - '.github/workflows/release.yml'
      - 'desktop/src-tauri/tauri.conf.json'
      - 'desktop/src-tauri/Cargo.toml'
      - 'desktop/src-tauri/Cargo.lock'
      - 'docs/releases/**'
  workflow_dispatch:

permissions:
  contents: read

# Pushes to main queue rather than cancel, so a release is never cut off.
concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: ${{ github.ref != 'refs/heads/main' }}

jobs:
  version:
    name: Release needed
    runs-on: ubuntu-24.04
    outputs:
      version: ${{ steps.check.outputs.version }}
      release: ${{ steps.check.outputs.release }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: The app's version, and whether it is released
        id: check
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(jq -r .version desktop/src-tauri/tauri.conf.json)
          cargo=$(sed -n 's/^version = "\(.*\)"$/\1/p' desktop/src-tauri/Cargo.toml | head -n1)
          if [ "$version" != "$cargo" ]; then
            echo "::error::tauri.conf.json says $version but Cargo.toml says $cargo"
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
          if [ "$GITHUB_REF" = refs/heads/main ] && [ "$GITHUB_EVENT_NAME" = push ] \
            && ! gh release view "v$version" --repo "$GITHUB_REPOSITORY" > /dev/null 2>&1; then
            echo "release=true" >> "$GITHUB_OUTPUT"
            echo "Publishing v$version"
          else
            echo "release=false" >> "$GITHUB_OUTPUT"
          fi

  appimage:
    name: AppImage
    needs: version
    # On main, only when there's a release to publish.
    if: github.event_name != 'push' || needs.version.outputs.release == 'true'
    # The oldest supported Ubuntu, so the AppImage runs on distributions
    # with an older glibc than the build machine's.
    runs-on: ubuntu-22.04
    permissions:
      contents: write
    env:
      APPIMAGE: rag-wrapper-${{ needs.version.outputs.version }}-x86_64.AppImage
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Tauri's system libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y libwebkit2gtk-4.1-dev libayatana-appindicator3-dev librsvg2-dev libxdo-dev libssl-dev file
      - uses: dtolnay/rust-toolchain@b725eda525362e7cf34af9a7243cac1e3f01a7ec # stable branch
        with:
          toolchain: stable
      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          workspaces: desktop/src-tauri
          cache-bin: true
      - name: Tauri's CLI
        run: cargo install tauri-cli --version "=2.12.3" --locked
      - name: Build the AppImage
        working-directory: desktop/src-tauri
        run: cargo tauri build --bundles appimage
      - name: Name it after the version
        run: mv desktop/src-tauri/target/release/bundle/appimage/*.AppImage "$APPIMAGE"
      - name: It holds the stack files
        run: |
          chmod +x "$APPIMAGE"
          "./$APPIMAGE" --appimage-extract > /dev/null
          test -x squashfs-root/AppRun
          test -f squashfs-root/usr/lib/rag-wrapper/stack/compose.yaml
          test -d squashfs-root/usr/lib/rag-wrapper/stack/docker/rathena
          rm -rf squashfs-root
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        if: needs.version.outputs.release != 'true'
        with:
          name: ${{ env.APPIMAGE }}
          path: ${{ env.APPIMAGE }}
          retention-days: 14
      - name: Publish the release
        if: needs.version.outputs.release == 'true'
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ needs.version.outputs.version }}
        run: |
          commit=$(sed -n 's/^RATHENA_COMMIT=//p' .env.example)
          {
            if [ -f "docs/releases/$VERSION.md" ]; then
              cat "docs/releases/$VERSION.md"
              echo
            fi
            echo "Server: rAthena [\`${commit:0:7}\`](https://github.com/akreao/rathena/commit/$commit) on the \`rag-wrapper\` branch."
            echo
            echo "Download the AppImage, make it executable (\`chmod +x\`) and run it. It needs Docker with the Compose plugin, and FUSE 2 (\`libfuse2\`, or \`libfuse2t64\` on Ubuntu 24.04)."
          } > notes.md
          gh release create "v$VERSION" "$APPIMAGE" --target "$GITHUB_SHA" \
            --title "rag-wrapper v$VERSION" --notes-file notes.md --generate-notes
