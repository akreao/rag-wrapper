{{define "content"}}<h1>Who's online</h1>
{{with .Data}}
<p>{{len .}} {{if eq (len .) 1}}character{{else}}characters{{end}} in the game right now.</p>
<table>
  <thead><tr><th>Name</th><th>Class</th><th>Base</th><th>Job</th><th>Map</th></tr></thead>
  <tbody>
  {{range .}}<tr><td>{{.Name}}</td><td>{{.JobName}}</td><td>{{.BaseLevel}}</td><td>{{.JobLevel}}</td><td>{{.Map}}</td></tr>{{end}}
  </tbody>
</table>
{{else}}
<p>Nobody is in the game right now.</p>
{{end}}{{end}}
