{{define "content"}}<h1>Log in</h1>
<form method="post" action="/login" class="card">
  <input type="hidden" name="csrf" value="{{.CSRF}}">
  <label>Username <input name="userid" value="{{index .Form "userid"}}" autocomplete="username" required autofocus></label>
  <label>Password <input type="password" name="password" autocomplete="current-password" required></label>
  <button>Log in</button>
</form>
<p>No account yet? <a href="/register">Create one</a>. New to this server? See <a href="/connect">how to connect</a> your game client.</p>{{end}}
